// Source stack: Road Lines 180d5b1; checked against official SDK docs 2026-11-09.
def configString = { String value -> groovy.json.JsonOutput.toJson(value) }
def adMode = System.getenv('ARROWS_AD_MODE') ?: 'test'
if (!(adMode in ['disabled', 'test', 'live'])) throw new GradleException('Invalid ARROWS_AD_MODE')
def interstitialId = adMode == 'test' ? 'demo-interstitial-yandex' : adMode == 'live' ? System.getenv('YANDEX_INTERSTITIAL_AD_UNIT_ID') ?: '' : ''
def rewardedId = adMode == 'test' ? 'demo-rewarded-yandex' : adMode == 'live' ? System.getenv('YANDEX_REWARDED_AD_UNIT_ID') ?: '' : ''
def analyticsKey = (adMode == 'live' ? System.getenv('APPMETRICA_API_KEY') : System.getenv('APPMETRICA_DEBUG_API_KEY')) ?: ''
if (adMode == 'live' && (!interstitialId || !rewardedId || !analyticsKey || interstitialId.startsWith('demo-') || rewardedId.startsWith('demo-')))
    throw new GradleException('Live SDK configuration is incomplete or uses demo ad units')
android {
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'AD_MODE', configString(adMode)
        buildConfigField 'String', 'INTERSTITIAL_AD_UNIT_ID', configString(interstitialId)
        buildConfigField 'String', 'REWARDED_AD_UNIT_ID', configString(rewardedId)
        buildConfigField 'String', 'ANALYTICS_API_KEY', configString(analyticsKey)
    }
}
dependencies {
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'io.appmetrica.analytics:analytics:8.6.0'
}
configurations.configureEach {
    ['identifiers', 'location', 'appsetid', 'ad-revenue', 'billing', 'screenshot', 'ndkcrashes'].each { module ->
        exclude group: 'io.appmetrica.analytics', module: "analytics-${module}"
    }
}
// A release candidate must use deliberate live configuration. Debug remains keyless/testable.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.doFirst {
        if (adMode != 'live') throw new GradleException('Release requires ARROWS_AD_MODE=live and complete SDK configuration')
    }
}
