apply plugin: 'com.android.application'

def playtestBuild = project.findProperty('arrowsPlaytest') == 'true'

android {
    namespace = "com.danilah.arrows"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId playtestBuild ? "com.danilah.arrows.playtest" : "com.danilah.arrows"
        manifestPlaceholders = [arrowsAppLabel: playtestBuild ? "Стрелки · Тест" : "@string/app_name"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 54
        versionName "0.38.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (playtestBuild) {
        def playtestKey = System.getenv('ARROWS_DEBUG_KEYSTORE')
        if (!playtestKey || !file(playtestKey).isFile()) throw new GradleException('Playtest requires its cached signing key')
        signingConfigs.debug {
            storeFile file(playtestKey)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    signingConfigs {
        production {
            def path = System.getenv('ARROWS_RELEASE_KEYSTORE')
            if (path && file(path).isFile()) storeFile file(path)
            storePassword System.getenv('ARROWS_RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('ARROWS_RELEASE_KEY_ALIAS')
            keyPassword System.getenv('ARROWS_RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.production
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Same optimizer/bridge rules, isolated package and test SDK config.
        // This proves compilation/payload properties before owner supplies IDs.
        // It is never a production-signed or device-accepted release.
        releaseCheck {
            initWith release
            applicationIdSuffix '.releasecheck'
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
            buildConfigField 'String', 'AD_MODE', '"test"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT_ID', '"demo-interstitial-yandex"'
            buildConfigField 'String', 'REWARDED_AD_UNIT_ID', '"demo-rewarded-yandex"'
            buildConfigField 'String', 'ANALYTICS_API_KEY', '""'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply from: '../arrows-platform.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
