<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1e1e2c" />
    <title>Стрелки</title>
  </head>
  <body>
    <main id="game-shell" data-status="starting">
      <div id="game-root" tabindex="0" role="application" aria-label="Arrow puzzle"></div>
      <div id="tutorial-pointer" hidden aria-hidden="true"></div>
      <header id="game-header">
        <div class="top-row">
          <div class="top-actions">
            <button id="choose-field" class="circle" type="button" aria-label="Choose a board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
            <button id="restart" class="circle" type="button" aria-label="Restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8a8 8 0 1 1-1 7M5 3v6h6"/></svg></button>
          </div>
          <div class="heading"><h1 id="app-title">Стрелки</h1><span id="difficulty"></span></div>
          <div class="top-spacer"></div>
        </div>
        <div id="hearts" aria-label="Lives: 3"><span>♥</span><span>♥</span><span>♥</span></div>
        <div id="board-progress" role="progressbar" aria-label="Board progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div id="progress-fill"></div></div>
      </header>
      <footer id="game-footer">
        <section id="win" hidden><strong id="win-title"></strong><button id="next" class="primary" type="button"></button></section>
        <p id="app-status"></p>
        <button id="hint" class="hint-button" type="button" hidden></button>
        <button id="guides" class="circle" type="button" aria-pressed="false" aria-label="Show exit directions">#</button>
        <span id="field-name"></span>
      </footer>
      <aside id="save-status" hidden role="status"><span id="save-message"></span><button id="save-retry" type="button"></button><button id="session-play" type="button" hidden></button></aside>
      <dialog id="game-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
      <section id="startup-preload" data-state="idle" aria-hidden="true">
        <div class="startup-card">
          <strong id="startup-preload-heading">Загрузка</strong>
          <span id="startup-preload-status">Подготавливаем игру…</span>
          <div id="startup-preload-progress-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="startup-preload-progress-fill"></div></div>
          <span id="startup-preload-progress-percent">00%</span>
        </div>
      </section>
      <aside id="debug-root" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
