name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run android:sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  android:
    env:
      APPMETRICA_DEBUG_API_KEY: ${{ secrets.APPMETRICA_DEBUG_API_KEY }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arrows-debug-signing-v1
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: arrows-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-unit-results
          path: native/android/app/build/test-results/testDebugUnitTest/
          retention-days: 7
      - uses: actions/cache@v4
        id: playtest-key
        with:
          path: .ci-signing/playtest.keystore
          key: arrows-playtest-signing-v1
      - name: Create playtest key on first build
        if: steps.playtest-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair -keystore .ci-signing/playtest.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arrows Playtest,O=Arrows,C=RU"
      - name: Build isolated phone playtest
        run: ./gradlew --no-daemon -ParrowsPlaytest=true assembleDebug
        working-directory: native/android
        env:
          ARROWS_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/playtest.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: arrows-playtest
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
