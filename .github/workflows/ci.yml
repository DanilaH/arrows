name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # A version-only lockfile change must not discard the cache for the exact
      # pinned kit. Its repository may require separate read access on a cold CI.
      - name: Restore pinned dependency cache
        uses: actions/cache/restore@v4
        with:
          # Match setup-node's raw cache path; '~/.npm' has a different cache version.
          path: /home/runner/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-x64-npm-
      - run: npm ci --prefer-offline
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --workers=2
      - run: npm run android:sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  release-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore pinned dependency cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-x64-npm-
      - run: npm ci --prefer-offline
      - run: npx playwright install --with-deps chromium
      - name: Audit archive capacity and localized release web
        run: |
          npx vite build --ssr tools/audit/ui-composition-source.ts --outDir .test-output/production-readiness/ssr
          node tools/qa/audit-save-growth.mjs
          npx vite build --mode release --outDir .test-output/release-web
          node tools/qa/audit-release-web.mjs
        env:
          ARROWS_AUDIT_SOURCE: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-audit
          path: |
            .test-output/save-capacity-audit/
            .test-output/production-readiness/
          retention-days: 7
      - name: Enforce reported production capacity gate
        run: node -e "const r=require('./.test-output/save-capacity-audit/report.json'); if(r.productionGate!=='PASS')throw Error('Production release blocked by archive save capacity; see audit artifact and readiness report')"
  android:
    env:
      APPMETRICA_DEBUG_API_KEY: ${{ secrets.APPMETRICA_DEBUG_API_KEY }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore pinned dependency cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-x64-npm-
      - run: npm ci --prefer-offline
      - run: npm run android:sync
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arrows-debug-signing-v1
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: arrows-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-unit-results
          path: native/android/app/build/test-results/testDebugUnitTest/
          retention-days: 7
      - uses: actions/cache@v4
        id: playtest-key
        with:
          path: .ci-signing/playtest.keystore
          key: arrows-playtest-signing-v1
      - name: Create playtest key on first build
        if: steps.playtest-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair -keystore .ci-signing/playtest.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arrows Playtest,O=Arrows,C=RU"
      - name: Build isolated phone playtest
        run: ./gradlew --no-daemon -ParrowsPlaytest=true assembleDebug
        working-directory: native/android
        env:
          ARROWS_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/playtest.keystore
      - name: Verify playtest update identity
        run: |
          mkdir -p .test-output/playtest-verification
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk > .test-output/playtest-verification/signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging native/android/app/build/outputs/apk/debug/app-debug.apk > .test-output/playtest-verification/manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree native/android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > .test-output/playtest-verification/manifest-tree.txt
          sha256sum native/android/app/build/outputs/apk/debug/app-debug.apk > .test-output/playtest-verification/apk.sha256
          python3 -c "import json,re; from pathlib import Path; expected=json.loads(Path('docs/evidence/content-rollout-030/build-verification.json').read_text())['signature']['certificateSha256']; actual=Path('.test-output/playtest-verification/signing.txt').read_text(); assert re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F:]+)',actual)[1].replace(':','').lower()==expected; assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in actual"
      - uses: actions/upload-artifact@v4
        with:
          name: playtest-verification
          path: .test-output/playtest-verification/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: arrows-playtest
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Prepare production-only web payload
        run: npm run android:sync:release
      - name: Verify production configuration fails closed
        working-directory: native/android
        run: |
          if ./gradlew --no-daemon assembleRelease > release-negative.log 2>&1; then
            echo 'Unexpected production build without live configuration/signing'; exit 1
          fi
          python3 -c "from pathlib import Path; assert 'Release requires ARROWS_AD_MODE=live' in Path('release-negative.log').read_text(); print('Production without live configuration: correctly blocked')"
      - name: Compile isolated optimized release check
        working-directory: native/android
        run: ./gradlew --no-daemon assembleReleaseCheck
      - name: Inspect optimized release-check payload
        run: python3 tools/qa/verify-release-payload.py native/android/app/build/outputs/apk/releaseCheck/app-releaseCheck.apk --kind releasecheck --out .test-output/releasecheck-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: releasecheck-verification
          path: |
            .test-output/releasecheck-verification/
            native/android/app/build/outputs/mapping/releaseCheck/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: arrows-releasecheck-NOT-PRODUCTION
          path: native/android/app/build/outputs/apk/releaseCheck/app-releaseCheck.apk
          retention-days: 7
